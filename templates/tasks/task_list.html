{% extends "../base.html" %}
{% block content %}
  <a href="{% url "tasks:task-create" %}">Нова задача</a>
  <form class="row row-cols-lg-auto g-3 align-items-center" method="get">
    {{ form.as_div }}
    <div class="col-12">
      <button class="btn btn-primary" type="submit">Фільтрувати</button>
    </div>
  </form>
  <ul>
    {% for task in tasks %}
      <li>
        <a href="{% url "tasks:task-detail" task.pk %}">{{ task }}</a>
      </li>
    {% empty %}
      <li>Задач немає :(</li>
    {% endfor %}
  </ul>
{% endblock content %}
