{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-3">{{ task.title }}</h2>
                <hr>
                <p class="card-text fs-5 text-secondary">{{ task.description }}</p>
                
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="{% url 'tasks:task-list' %}" class="btn btn-secondary">Back to List</a>
                    <div>
                        <a href="{% url 'tasks:task-update' task.pk %}" class="btn btn-outline-secondary me-2">Edit</a>
                        <a href="{% url 'tasks:task-delete' task.pk %}" class="btn btn-outline-danger">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
